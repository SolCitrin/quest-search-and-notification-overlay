; Quest Search and Notification Overlay settings (file names unchanged from Quest Search Overlay). Changes apply the
; next time the game starts.
; Since 0.11.0 the overlay has a Settings page (J, then the gear button) for the [Nearby] and [Notifications]
; options (and bOpenOnMap since 0.12.0, game notifications since 0.16.0). Its choices are saved in My Games/Skyrim Special Edition/SKSE/QuestSearchOverlay_Settings.ini and
; override this file; its "Reset" button goes back to the values here.

[General]
; 1 = the overlay opens on whatever key you bind to Journal in the game's Controls menu (J by default), and that key
;     no longer opens the vanilla journal from gameplay. The pause menu's Quests tab still works.
; 0 = leave the Journal key alone (it opens the vanilla journal again) and open the overlay with iHotkey instead.
bInterceptJournalKey=1

; 1 = on the world map the same key (the map's own Journal binding, J by default) opens the overlay too, instead of
;     the game's journal, and "Show on map" then moves the open map to the objective. 0 = the map keeps the game's
;     journal. Also on the overlay's Settings page.
bOpenOnMap=1

; Only used when bInterceptJournalKey=0. A DirectInput scan code, e.g. 0x25 = K, 0x3D = F3, 0x3E = F4.
; List: https://www.creationkit.com/index.php?title=Input_Script#DXScanCodes   0 = no key.
iHotkey=0

; 1 = the Completed filter starts switched on.
bShowCompleted=0

; 1 = keep the search text and filters between openings. 0 = start fresh every time.
bRememberSearch=0

; How many current objectives to show under each quest (1 to 10). Search always covers all of them.
iMaxObjectives=3

; 1 = group the list under quest-type headings (Pinned, Main, Civil War, ..., Side, Misc, Completed); click a heading
;     to fold it. 0 = one flat list (pinned quests still come first). Also on the overlay's Settings page. (0.13.0)
bGroupHeadings=1

[Nearby]
; When you walk into a town, city or dungeon where an open objective has its marker, a message in the top-left
; corner says so: "2 quests here in Riften (press J)". Shown once per visit; walking into a house does not repeat it.
bNotifyArrive=1

; When you leave that town, city or dungeon with objectives still open there: "Leaving Riften: 2 objectives still
; here (The Raid, Hunt and Gather)". Tracked and untracked quests both count.
bNotifyLeave=1

; Outdoors, when you come within iNearbyRadius metres of an open objective: "Nearby: Hunt and Gather: Retrieve
; Wylandriah's Spoon (150 m)". Once per approach: it comes again only after you have been well away (1.5x the radius).
; A target indoors counts as the door that leads out to it. Objectives in the town you are in are left to the town
; message. (Replaces the hold messages of 0.10.1-0.10.3: the game has no hold borders for open land.)
bNotifyNearby=1

; How close counts as nearby, in metres (50 to 5000). One map cell is about 58 m.
iNearbyRadius=300

; 0 = leave Misc quests (radiant favours, "bring me X") out of the messages above. They still show in the overlay.
bNearbyIncludeMisc=1

; Seconds before the same message for the same place can show again (stops repeats when you step out and back in).
iNearbyCooldown=90

; Outdoors or in, when a quest updates and its new objective is in the town you are in or within iNearbyRadius:
; "Updated - here in Whiterun" / "Updated - 120 m". Same quest rules as above (bNearbyIncludeMisc applies).
bNotifyUpdates=1

[Notifications]
; 1 = Quest Search Overlay's own boxes (one box per quest, in the overlay's colours). 0 = the game's own top-left
; text, as before 0.11.0. The game's text is also used by itself if Prisma UI cannot show the boxes.
; While game notifications are on ([Capture] below), quest messages always use boxes and this is ignored.
iBoxStyle=1

; Where the boxes appear (quest boxes AND game notifications: one stack): 0 top-left, 1 top-right, 2 middle-left, 3 middle-right, 4 bottom-left, 5 bottom-right.
; Each slides in from its side of the screen. Since 0.17.0 the stack reads oldest to newest from top to bottom, like the
; game's own lines: at the top and middle spots new boxes join below the others, at the bottom spots the newest sits at
; the spot and pushes the older ones up.
iBoxPosition=1

; How long each box stays, in seconds (1 to 60). Its clock runs only while it is on screen: boxes wait while a menu,
; the console, a conversation, a loading screen or the quest overlay is open.
iBoxSeconds=8

; Box size in percent (50 to 200).
iBoxScale=100

; At most this many boxes at once (1 to 10), quest boxes and game notifications together. More wait their turn; the
; oldest box then leaves early, after iMinBoxSeconds on screen, one box per second. None is dropped.
iMaxBoxes=5

; Min time on screen, in seconds (1 to 30): how long a box stays before a waiting one may push it off. Boxes with more
; than 8 words get 0.3 s more per extra word (about 200 words a minute), still at most 30 s. Also on the Settings page.
iMinBoxSeconds=3

[Capture]
; Game notifications (0.16.0, the former HUD Notification Replacer). Also on the overlay's Settings page.
; 1 = the game's white top-left lines (vanilla "Iron Ore added", "Quicksaving...", other mods' Papyrus and SKSE
;     notifications) show as boxes, in the same stack, spot and size as the quest boxes above. Lines wait while a menu,
;     a conversation, the journal, a fade or a loading screen is up, and come out in order 2 s after it.
; 0 = the game shows its own lines, exactly as without this part.
; The hook is put in only at startup, so switching this ON needs a restart; switching it OFF works at once.
; Lines that B612 NotificationManager handles (Feeding Perk Notification) always stay the game's own text.
bEnabled=0

; Seconds each game line stays on screen (1 to 60). Quest boxes keep iBoxSeconds.
iLineSeconds=6

; 1 = extra log lines: which menus hold the boxes, when the view is shown or hidden. For testing. INI only.
bCaptureVerbose=0
